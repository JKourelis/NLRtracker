<title>__TITLE__</title>
<style>
:root{--bg:#fff;--fg:#14171a;--mut:#5b6570;--line:#dfe4e9;--panel:#f7f9fb;--acc:#0b6ea8;
      --dim:#eef2f5;--warn:#c1121f;--ok:#2a7f4f}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--fg:#e8ecef;--mut:#98a3ad;--line:#2c3339;
  --panel:#1b1f23;--acc:#5fb3e0;--dim:#242a2f;--warn:#ff7a85;--ok:#5fd39a}}
:root[data-theme="dark"]{--bg:#14171a;--fg:#e8ecef;--mut:#98a3ad;--line:#2c3339;--panel:#1b1f23;
  --acc:#5fb3e0;--dim:#242a2f;--warn:#ff7a85;--ok:#5fd39a}
:root[data-theme="light"]{--bg:#fff;--fg:#14171a;--mut:#5b6570;--line:#dfe4e9;--panel:#f7f9fb;
  --acc:#0b6ea8;--dim:#eef2f5;--warn:#c1121f;--ok:#2a7f4f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
 font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;
 gap:14px;align-items:baseline}
h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:12.5px}
nav{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;
 background:var(--panel)}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);
 padding:9px 13px;font:inherit;font-size:13.5px;cursor:pointer}
nav button:hover{color:var(--fg)}
nav button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--acc);font-weight:600}
main{padding:16px 20px;max-width:1500px}
section{display:none}section.on{display:block}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);
 margin:22px 0 8px;font-weight:600}
h2:first-child{margin-top:4px}
table{border-collapse:collapse;font-size:13px;margin-bottom:6px}
th,td{text-align:left;padding:4px 12px 4px 0;border-bottom:1px solid var(--line);
 vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;
 letter-spacing:.04em;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;padding-right:16px}
.cards{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px}
.card{border:1px solid var(--line);border-radius:8px;padding:9px 14px;min-width:112px;
 background:var(--panel)}
.card .v{font-size:21px;font-weight:650;font-variant-numeric:tabular-nums}
.card .k{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.bar{height:9px;border-radius:5px;background:var(--dim);overflow:hidden;min-width:110px;
 display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--acc)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px}
input[type=search],select{background:var(--bg);color:var(--fg);border:1px solid var(--line);
 border-radius:6px;padding:6px 9px;font:inherit;font-size:13px}
input[type=search]{min-width:230px}
.hint{color:var(--mut);font-size:12.5px}
.prot{border:1px solid var(--line);border-radius:8px;margin-bottom:7px;background:var(--panel);
 overflow:hidden}
.prot>summary{cursor:pointer;padding:8px 12px;display:flex;gap:12px;align-items:center;
 flex-wrap:wrap;list-style:none}
.prot>summary::-webkit-details-marker{display:none}
.prot>summary::before{content:"\25B8";color:var(--mut);font-size:11px}
.prot[open]>summary::before{content:"\25BE"}
.pid{font-weight:620;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;
 color:var(--mut);white-space:nowrap}
.tag.amb{border-color:var(--warn);color:var(--warn)}
.tag.arch{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.body{padding:2px 12px 12px}
.legend{display:flex;flex-wrap:wrap;gap:11px;font-size:11.5px;color:var(--mut);margin:6px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;border:1px solid rgba(0,0,0,.22)}
svg.schem{display:block;width:100%;height:auto}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.more{margin:10px 0;padding:7px 12px;border:1px solid var(--line);border-radius:6px;
 background:none;color:var(--fg);font:inherit;font-size:13px;cursor:pointer}
.more:hover{border-color:var(--acc)}
a{color:var(--acc)}
</style>

<header>
  <h1 id="h-title">NLRtracker report</h1>
  <div class="sub" id="h-sub"></div>
</header>

<nav id="nav"></nav>
<main>
  <section id="v-overview" class="on"></section>
  <section id="v-class"></section>
  <section id="v-protein"></section>
  <section id="v-id"></section>
  <section id="v-arch"></section>
  <section id="v-phylo"></section>
</main>

<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
const DATA = JSON.parse(document.getElementById("payload").textContent);
const P = DATA.proteins, PAL = DATA.palette, META = DATA.meta;
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const isAmb = c => !c || c.indexOf(" or ")>=0 || c==="UNDETERMINED";
const colour = r => PAL[r] || "#999";

document.getElementById("h-title").textContent =
  "NLRtracker \u2014 " + (META.input || "report");
document.getElementById("h-sub").textContent =
  [META.n_classified+" classified of "+META.n_input_sequences+" sequences",
   "InterProScan "+META.interproscan_version,
   "InterPro "+META.interpro_version,
   META.run_date].filter(Boolean).join(" \u00b7 ");

/* ---------------------------------------------------------------- helpers */
function tally(fn){const m=new Map();for(const p of P){const k=fn(p);if(k==null)continue;
  m.set(k,(m.get(k)||0)+1);}return [...m.entries()].sort((a,b)=>b[1]-a[1]);}
function barTable(rows,total,headers){
  let h='<table><tr>'+headers.map(x=>'<th'+(x.n?' class="num"':'')+'>'+esc(x.t)+'</th>').join('')+'</tr>';
  for(const r of rows){
    const pct=total?(100*r[1]/total):0;
    h+='<tr><td>'+esc(r[0])+'</td><td class="num">'+r[1]+'</td>'+
       '<td class="num">'+pct.toFixed(1)+'%</td>'+
       '<td><span class="bar"><i style="width:'+pct.toFixed(1)+'%"></i></span></td></tr>';
  }
  return h+'</table>';
}
/* client-side schematic. Regions behind, NB-ARC on top, integrated domains labelled. */
function schematic(p, opts){
  opts = opts||{};
  const W=1000, H=opts.motifs?58:42, pad=6, y=opts.motifs?18:14, h=17;
  const sc = x => pad + (W-2*pad) * (x/Math.max(p.n,1));
  let s='<svg class="schem" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" '+
        'role="img" aria-label="domain architecture of '+esc(p.i)+'">';
  s+='<rect x="'+pad+'" y="'+(y+h/2-2)+'" width="'+(W-2*pad)+'" height="4" rx="2" fill="#b9c2ca"/>';
  const back=p.r.filter(r=>r[0]!=="NB-ARC"&&r[0]!=="PLOOP");
  const front=p.r.filter(r=>r[0]==="NB-ARC"||r[0]==="PLOOP");
  for(const r of back.concat(front)){
    const x1=sc(r[1]), x2=sc(r[2]), w=Math.max(x2-x1,1.2);
    s+='<rect x="'+x1.toFixed(1)+'" y="'+y+'" width="'+w.toFixed(1)+'" height="'+h+
       '" rx="2.5" fill="'+colour(r[0])+'" stroke="rgba(0,0,0,.28)" stroke-width=".7"><title>'+
       esc(r[0])+' '+r[1]+'-'+r[2]+'</title></rect>';
    if(w>34) s+='<text x="'+((x1+x2)/2).toFixed(1)+'" y="'+(y+h/2+3.6)+
       '" text-anchor="middle" font-size="9.5" font-weight="600" fill="#14171a">'+esc(r[0])+'</text>';
  }
  for(const d of p.d){
    const x1=sc(d[1]),x2=sc(d[2]);
    s+='<rect x="'+x1.toFixed(1)+'" y="'+(y-4)+'" width="'+Math.max(x2-x1,1.5).toFixed(1)+
       '" height="'+(h+8)+'" fill="none" stroke="#14171a" stroke-width="1.1" '+
       'stroke-dasharray="2,1.6"><title>'+esc(d[0])+' '+d[1]+'-'+d[2]+'</title></rect>';
    s+='<text x="'+((x1+x2)/2).toFixed(1)+'" y="'+(y-7)+'" text-anchor="middle" '+
       'font-size="9" font-weight="700" fill="currentColor">'+esc(d[0])+'</text>';
  }
  if(opts.motifs) for(const m of p.f){
    const x1=sc(m[1]),x2=sc(m[2]);
    s+='<rect x="'+x1.toFixed(1)+'" y="'+(y+h+4)+'" width="'+Math.max(x2-x1,1.2).toFixed(1)+
       '" height="6" fill="#8d97a0"><title>'+esc(m[0])+' '+m[1]+'-'+m[2]+'</title></rect>';
  }
  s+='<text x="'+(W-pad)+'" y="'+(y+h+ (opts.motifs?18:13))+'" text-anchor="end" font-size="9" '+
     'fill="currentColor" opacity=".55">'+p.n+' aa</text>';
  return s+'</svg>';
}
function legendFor(list){
  const seen=[...new Set(list)];
  return '<div class="legend">'+seen.map(r=>'<span><i style="background:'+colour(r)+
    '"></i>'+esc(r)+'</span>').join('')+'</div>';
}
function protCard(p, open){
  const amb=isAmb(p.c);
  let head='<summary><span class="pid">'+esc(p.i)+'</span>'+
    '<span class="tag">'+esc(p.s)+'</span>'+
    '<span class="tag'+(amb?' amb':'')+'">'+esc(p.c)+'</span>'+
    (p.u?'<span class="tag">'+esc(p.u)+'</span>':'')+
    '<span class="tag arch">'+esc(p.m)+'</span>'+
    (p.p&&p.p.clade?'<span class="tag">\u2691 '+esc(p.p.clade)+'</span>':'')+
    '<span class="tag">'+p.n+' aa</span></summary>';
  let body='<div class="body">'+schematic(p,{motifs:true})+
    legendFor(p.r.map(r=>r[0]))+
    '<div class="mono" style="margin-top:6px">'+esc(p.a)+'</div>';
  if(p.d.length) body+='<div class="hint" style="margin-top:5px">integrated: '+
    p.d.map(d=>esc(d[0])+' ('+d[1]+'-'+d[2]+')').join(', ')+'</div>';
  if(p.p){
    const q=p.p;
    body+='<table style="margin-top:8px"><tr><th>clade</th><th>path</th><th>nearest RefPlantNLR</th>'+
      '<th class="num">distance</th><th>category</th></tr><tr><td>'+esc(q.clade)+'</td><td>'+
      esc(q.clade_path)+'</td><td class="mono">'+esc(q.nearest_ref)+'</td><td class="num">'+
      esc(q.nearest_dist)+'</td><td>'+esc(q.category)+'</td></tr></table>';
  }
  return '<details class="prot"'+(open?' open':'')+'>'+head+body+'</div></details>';
}

/* ---------------------------------------------------------------- views */
function vOverview(){
  const n=P.length;
  const amb=P.filter(p=>isAmb(p.c)).length;
  const withID=P.filter(p=>p.d.length>0).length;
  const multiN=P.filter(p=>p.r.filter(r=>r[0]==="NB-ARC").length>1).length;
  let h='<div class="cards">'+
    [["proteins",n],["ambiguous / undetermined",amb+" ("+(100*amb/n).toFixed(1)+"%)"],
     ["with integrated domain",withID],["multiple NB-ARC",multiN]]
    .map(c=>'<div class="card"><div class="v">'+c[1]+'</div><div class="k">'+c[0]+'</div></div>').join('')+
    '</div>';
  h+='<h2>Status</h2>'+barTable(tally(p=>p.s),n,[{t:"status"},{t:"n",n:1},{t:"%",n:1},{t:""}]);
  h+='<h2>Subclass</h2>'+barTable(tally(p=>p.c),n,[{t:"subclass"},{t:"n",n:1},{t:"%",n:1},{t:""}]);
  h+='<h2>Evidence tier <span class="hint">(how each subclass call was reached)</span></h2>'+
     barTable(tally(p=>p.u||"(none)"),n,[{t:"tier"},{t:"n",n:1},{t:"%",n:1},{t:""}]);
  const rc=new Map();
  for(const p of P) for(const r of p.r) rc.set(r[0],(rc.get(r[0])||0)+1);
  h+='<h2>Regions</h2>'+barTable([...rc.entries()].sort((a,b)=>b[1]-a[1]),
     [...rc.values()].reduce((a,b)=>a+b,0),[{t:"region"},{t:"n",n:1},{t:"%",n:1},{t:""}]);
  h+='<h2>Run</h2><table>'+Object.entries(META).map(([k,v])=>
     '<tr><th>'+esc(k)+'</th><td class="mono">'+esc(v)+'</td></tr>').join('')+'</table>';
  return h;
}
function vClass(){
  let h='<p class="hint">One panel per subclass, with the architectures it contains and up to '+
        'six representative proteins.</p>';
  for(const [sc,n] of tally(p=>p.c)){
    const set=P.filter(p=>p.c===sc);
    h+='<h2>'+esc(sc)+' <span class="hint">'+n+' proteins</span></h2>';
    const at=new Map();
    for(const p of set) at.set(p.m,(at.get(p.m)||0)+1);
    h+=barTable([...at.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8),n,
       [{t:"architecture"},{t:"n",n:1},{t:"%",n:1},{t:""}]);
    for(const p of set.slice().sort((a,b)=>b.n-a.n).slice(0,6)) h+=protCard(p,false);
  }
  return h;
}
let protState={q:"",sc:"",st:"",limit:60};
function vProtein(){
  const scs=[...new Set(P.map(p=>p.c))].sort();
  const sts=[...new Set(P.map(p=>p.s))].sort();
  let h='<div class="controls">'+
    '<input type="search" id="q" placeholder="search protein id\u2026" value="'+esc(protState.q)+'">'+
    '<select id="fsc"><option value="">all subclasses</option>'+
      scs.map(s=>'<option'+(protState.sc===s?' selected':'')+'>'+esc(s)+'</option>').join('')+'</select>'+
    '<select id="fst"><option value="">all statuses</option>'+
      sts.map(s=>'<option'+(protState.st===s?' selected':'')+'>'+esc(s)+'</option>').join('')+'</select>'+
    '<span class="hint" id="cnt"></span></div><div id="plist"></div>';
  return h;
}
function renderProtList(){
  const q=protState.q.toLowerCase();
  const sel=P.filter(p=>(!q||p.i.toLowerCase().includes(q))&&
    (!protState.sc||p.c===protState.sc)&&(!protState.st||p.s===protState.st));
  const show=sel.slice(0,protState.limit);
  document.getElementById("cnt").textContent=
    sel.length+" match"+(sel.length===1?"":"es")+(sel.length>show.length?", showing "+show.length:"");
  let h=show.map(p=>protCard(p,false)).join("");
  if(sel.length>show.length) h+='<button class="more" id="more">Show '+
    Math.min(120,sel.length-show.length)+' more</button>';
  const box=document.getElementById("plist"); box.innerHTML=h;
  const b=document.getElementById("more");
  if(b) b.onclick=()=>{protState.limit+=120;renderProtList();};
}
function vID(){
  const m=new Map();
  for(const p of P) for(const d of p.d){
    if(!m.has(d[0])) m.set(d[0],[]);
    const nb=p.r.filter(r=>r[0]==="NB-ARC");
    let pos="no NB-ARC";
    if(nb.length){ pos = d[2] < nb[0][1] ? "N-terminal" : (d[1] > nb[nb.length-1][2] ? "C-terminal" : "internal"); }
    m.get(d[0]).push({id:p.i,sc:p.c,pos:pos});
  }
  if(!m.size) return '<p class="hint">No integrated domains were found.</p>';
  const rows=[...m.entries()].sort((a,b)=>b[1].length-a[1].length);
  let h='<p class="hint">Every integrated domain, how many proteins carry it, and where it sits '+
        'relative to the NB-ARC.</p><table><tr><th>domain</th><th class="num">proteins</th>'+
        '<th>position</th><th>carried by</th></tr>';
  for(const [d,list] of rows){
    const pc=new Map(); for(const x of list) pc.set(x.pos,(pc.get(x.pos)||0)+1);
    h+='<tr><td><b>'+esc(d)+'</b></td><td class="num">'+list.length+'</td><td class="hint">'+
      [...pc.entries()].map(e=>e[0]+" \u00d7"+e[1]).join(", ")+'</td><td class="mono hint">'+
      list.slice(0,14).map(x=>esc(x.id)).join(", ")+(list.length>14?" \u2026":"")+'</td></tr>';
  }
  return h+'</table>';
}
function vArch(){
  const t=tally(p=>p.m);
  let h='<p class="hint">Simplified domain architectures. '+
    'C=CC R=RPW8 T=TIR B=R1 N=NB-ARC P=P-loop L=LRR J=C-JID O=integrated M=MLKL</p>';
  h+=barTable(t,P.length,[{t:"architecture"},{t:"n",n:1},{t:"%",n:1},{t:""}]);
  h+='<h2>Examples</h2>';
  for(const [a] of t.slice(0,14)){
    const p=P.find(x=>x.m===a);
    if(p) h+='<div class="hint mono" style="margin-top:9px">'+esc(a)+'</div>'+protCard(p,false);
  }
  return h;
}
function vPhylo(){
  if(!DATA.has_phylo) return '<p class="hint">No phylogenetic assignment in this run. '+
    'Re-run with <span class="mono">-p</span> to add clade assignment, nearest RefPlantNLR '+
    'relative, and architecture-versus-phylogeny discrepancies.</p>';
  const withP=P.filter(p=>p.p);
  let h='<h2>Category</h2>'+barTable(tally(p=>p.p?p.p.category:null),withP.length,
    [{t:"category"},{t:"n",n:1},{t:"%",n:1},{t:""}]);
  h+='<h2>Clade</h2>'+barTable(tally(p=>p.p?p.p.clade:null),withP.length,
    [{t:"clade"},{t:"n",n:1},{t:"%",n:1},{t:""}]);
  const interesting=withP.filter(p=>p.p.category&&p.p.category!=="agree");
  h+='<h2>Where phylogeny changes the answer <span class="hint">'+interesting.length+
     ' proteins</span></h2>';
  h+='<table><tr><th>protein</th><th>architecture subclass</th><th>clade</th>'+
     '<th>nearest RefPlantNLR</th><th class="num">dist</th><th>category</th></tr>'+
     interesting.slice(0,300).map(p=>'<tr><td class="mono">'+esc(p.i)+'</td><td>'+esc(p.c)+
     '</td><td>'+esc(p.p.clade)+'</td><td class="mono">'+esc(p.p.nearest_ref)+
     '</td><td class="num">'+esc(p.p.nearest_dist)+'</td><td>'+esc(p.p.category)+
     '</td></tr>').join('')+'</table>';
  return h;
}

/* ---------------------------------------------------------------- nav */
const VIEWS=[["overview","Overview",vOverview],["class","By class",vClass],
             ["protein","By protein",vProtein],["id","Integrated domains",vID],
             ["arch","Architectures",vArch],["phylo","Phylogeny",vPhylo]];
const nav=document.getElementById("nav");
nav.innerHTML=VIEWS.map(([k,l],i)=>'<button data-v="'+k+'" aria-selected="'+(i===0)+'">'+
  l+'</button>').join("");
const built={};
function show(k){
  for(const [id] of VIEWS){
    document.getElementById("v-"+id).classList.toggle("on",id===k);
  }
  nav.querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.v===k)));
  if(!built[k]){
    const fn=VIEWS.find(v=>v[0]===k)[2];
    document.getElementById("v-"+k).innerHTML=fn();
    built[k]=true;
    if(k==="protein"){
      document.getElementById("q").addEventListener("input",e=>{
        protState.q=e.target.value;protState.limit=60;renderProtList();});
      document.getElementById("fsc").addEventListener("change",e=>{
        protState.sc=e.target.value;protState.limit=60;renderProtList();});
      document.getElementById("fst").addEventListener("change",e=>{
        protState.st=e.target.value;protState.limit=60;renderProtList();});
      renderProtList();
    }
  }
}
nav.addEventListener("click",e=>{const b=e.target.closest("button");if(b)show(b.dataset.v);});
show("overview");
</script>
